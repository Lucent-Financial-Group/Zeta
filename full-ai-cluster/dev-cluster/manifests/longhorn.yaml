# Dev/CI alias StorageClass NAMED `longhorn`, backed by the local-path
# provisioner that kind and k3d already run.
#
# WHY THIS FILE EXISTS. The included Synced+Healthy proof asserted 19 of 45
# Applications. Eleven of the exclusions came from ONE content-based rule in
# `argocd-health-test.ts`: an Application whose YAML tree says
# `storageClass: longhorn` is auto-excluded, because `longhorn/**` is
# glob-excluded from the dev catalog, so no StorageClass by that name ever
# exists in the lane and the PVC hangs `Pending` forever. That was circular --
# the apps were excluded because Longhorn was excluded, and Longhorn was
# excluded because a kind node has no second disk to give it.
#
# The cheapest cut through the circle is not to change what production
# requests. It is to give dev a StorageClass that ANSWERS to that name. A
# StorageClass is a name bound to a provisioner; the workloads only ever name
# it. So dev binds `longhorn` to `rancher.io/local-path` and the same
# unmodified manifests -- the same 100Gi request, the same class name -- bind
# on a kind node.
#
# PRODUCTION IS UNTOUCHED, structurally and not by convention: this file lives
# under `full-ai-cluster/dev-cluster/`, which ArgoCD never reads. Only
# `bringUpKindCiCluster` / `bringUpK3dDevCluster` apply it, and they run only
# against a kind/k3d substrate. On the bare-metal cluster the `longhorn`
# StorageClass is created by the Longhorn chart itself, with
# `provisioner: driver.longhorn.io`.
#
# THE COLLISION THAT CANNOT HAPPEN, and its guard: if `longhorn/**` were ever
# dropped from `DEFAULT_ROOT_DEV_CATALOG.excludeGlob`, ArgoCD would try to
# create a second object of this name in the same dev cluster and the two would
# fight. `argocd-health-test.test.ts` asserts that `longhorn` is in that glob,
# so the removal turns a unit test red rather than a cluster confusing.
#
# WHAT THIS ALIAS DOES NOT BUY. `rancher.io/local-path` is node-local and
# ReadWriteOnce only. It cannot satisfy a `ReadWriteMany` claim, and it does not
# enforce the requested capacity (the volume is a directory on the node's
# filesystem, so a 100Gi request binds on a runner with far less). So an
# Application asking for RWX stays excluded -- structurally, by a rule that
# reads the access mode, not by a hand-maintained list.
#
# Do NOT deploy a second local-path provisioner Deployment: kind already ships
# one, and a duplicate fights it. This declares a NAME only.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn
  annotations:
    zeta.io/dev-substrate-alias: "true"
    zeta.io/dev-substrate-alias-reason: >-
      dev/CI stand-in for driver.longhorn.io so Applications that request
      storageClass longhorn can be asserted in the kind lane; never applied to
      the bare-metal cluster.
provisioner: rancher.io/local-path
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
