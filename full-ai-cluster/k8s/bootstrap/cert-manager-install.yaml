# cert-manager bootstrap install. K3S HelmChart CR — runs at first
# boot AFTER Cilium, BEFORE Vault.
#
# The ordering is real; the reason previously given for it was not. Vault does
# not consume a cert-manager Certificate — none exists for it in this tree. See
# applications/cert-manager/Application.yaml and bootstrap/vault-install.yaml.

apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: cert-manager
  namespace: kube-system
spec:
  chart: cert-manager
  repo: https://charts.jetstack.io
  version: v1.16.2
  targetNamespace: cert-manager
  createNamespace: true
  valuesContent: |-
    crds:
      enabled: true
    replicaCount: 1
    webhook: { replicaCount: 1 }
    cainjector: { replicaCount: 1 }
    prometheus:
      enabled: true
      servicemonitor: { enabled: false }
