# Valkey — the cache, and Orleans' cluster-membership store.
#
# WAS BITNAMI REDIS UNTIL 2026-09-01. The move is not a version bump; it is an
# escape from a distribution that stopped shipping versioned tags.
#
# WHAT WAS MEASURED, not assumed (2026-09-01, Docker Hub API):
#   docker.io/bitnamilegacy/redis   last published 2025-08-22 -- an ARCHIVE, frozen
#                                   over a year, explicitly receiving no updates
#   docker.io/bitnami/redis         active, but EVERY tag is `latest` or a cosign
#                                   artifact -- no versioned tags at all
#   docker.io/bitnami/valkey        the SAME: `latest` and `latest-metadata`, nothing
#                                   else. Bitnami's valkey chart defaults to
#                                   `tag: latest`, so switching flavours inside
#                                   Bitnami escapes nothing
#   docker.io/valkey/valkey         9.1.x, real versioned tags, published the day
#                                   this was written
#
# So bumping the Bitnami chart would have traded a frozen archive for an UNPINNED
# ROLLING TAG, which is worse: a frozen tag at least does not change under you.
#
# WHY THIS CHART. `valkey-io/valkey-helm` is the Valkey project's own chart, and it
# pins `valkey/valkey` with `tag: ""` -- resolving to the chart's appVersion rather
# than to `latest`. Rendered here at 0.11.0 it produces
# `docker.io/valkey/valkey:9.1.1`, a real immutable tag.
#
# WHY NOT KEEP A BITNAMI CHART AND OVERRIDE THE IMAGE. That is what the old pin did
# (`bitnamilegacy/redis` + `allowInsecureImages`), and it worked only because the
# archive is still a BITNAMI image with Bitnami's filesystem layout. Pointing a
# Bitnami chart at `valkey/valkey` would not work: the chart's scripts assume
# `/opt/bitnami`, and `allowInsecureImages` silences the assertion that would have
# told us so.
#
# WORKFLOW FIT. Orleans reads cluster membership from here
# (`Microsoft.Orleans.Clustering.Redis` over StackExchange.Redis). Valkey is
# wire-compatible, so the client is unchanged; the endpoint moved and
# orleans/configmap.yaml moved with it, in this same commit.
#
# AUTH IS ACL-BASED HERE, which is the one real difference. Bitnami took a single
# password; Valkey defines users. `default` carries our existing `redis-auth`
# secret's `password` key, so StackExchange.Redis's plain AUTH still works, and a
# `replicator` user exists because the chart REFUSES replica mode without one.
#
# STILL OPEN, and unchanged by this commit: the `redis-auth` secret does not exist
# in the tree. That is why the orleans StatefulSet stays at replicas 0.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  name: redis
  namespace: argocd
  finalizers: [ resources-finalizer.argocd.argoproj.io ]
spec:
  project: default
  source:
    repoURL: https://valkey-io.github.io/valkey-helm
    chart: valkey
    targetRevision: 0.11.0
    helm:
      releaseName: redis
      valuesObject:
        # DECLARED, because this chart declares nothing. `resources: {}` is its
        # default, which renders BestEffort pods -- and a BestEffort pod is the
        # first thing evicted under node pressure. Orleans reads its CLUSTER
        # MEMBERSHIP from here, so an evicted cache is a cluster that loses its
        # membership store, not a cache miss.
        #
        # 100m / 128Mi per pod matches what bitnami's `resourcesPreset: nano`
        # rendered, so this is the old reservation carried forward rather than a
        # new number invented at the switch. Two pods render (primary + one
        # replica), so the Application totals 200m / 256Mi -- DOWN from 300m /
        # 384Mi, because bitnami rendered three pods for the same role.
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 256Mi
        auth:
          # ACL users, not a bare password. The chart REFUSES to render with
          # auth.enabled and no `default` user -- a good refusal: without one,
          # anyone reaches the database with no credential at all.
          enabled: true
          usersExistingSecret: redis-auth # create via Sealed Secret / Vault
          aclUsers:
            default:
              permissions: "~* &* +@all"
              passwordKey: password
            replicator:
              # The chart requires a replica user when replica.enabled is true,
              # and requires it to hold exactly these verbs.
              permissions: "+psync +replconf +ping"
              passwordKey: password
        replica:
          enabled: true
          # WAS replicaCount 2 under Bitnami; this chart counts replicas SEPARATELY
          # from the primary (total pods = replicas + 1), so 1 here is 2 pods, the
          # same footprint as before rather than a silent halving.
          replicas: 1
          # `replicationUser`, NOT `username`. inert-valuesobject-keys refused the
          # first spelling and was right: the chart defaults replicationUser to
          # "default", so a wrong key here renders CLEANLY and silently replicates
          # as the full-privilege default user instead of this minimal one. Exactly
          # the failure that guard exists to catch, caught on my own values.
          replicationUser: replicator
          persistence:
            # SIZE CARRIED FORWARD from the Bitnami pin: 8Gi, chosen there as a
            # size cut and not a pod cut. The volume is RDB/AOF spill, so it bounds
            # what survives a restart, not what can be cached -- maxmemory governs
            # that and is a memory setting, not this one.
            size: 8Gi
            storageClass: longhorn
        # NO TOP-LEVEL `persistence:` HERE. An earlier draft had one and
        # inert-valuesobject-keys refused it: this chart has no such key. One
        # StatefulSet renders with `replicas: 2` -- primary plus replica -- and the
        # single volumeClaimTemplate above covers both pods, so the top-level block
        # governed nothing while looking like it governed the primary's disk.
  destination:
    server: https://kubernetes.default.svc
    namespace: redis
  syncPolicy:
    automated: { prune: false, selfHeal: true }
    syncOptions: [ CreateNamespace=true, ServerSideApply=true ]
