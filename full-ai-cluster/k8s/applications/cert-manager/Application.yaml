# cert-manager — TLS cert provisioning for the cluster.
# Installed by K3S at bootstrap, before Vault. ArgoCD then adopts and
# reconciles ongoing.
#
# NOT TRUE, THOUGH IT USED TO BE WRITTEN HERE: cert-manager does not provide
# Vault's API certificate. No `Certificate` resource for Vault exists under
# full-ai-cluster/k8s, and the only issuers in the tree are the two Let's
# Encrypt ACME ClusterIssuers (applications/platform/clusterissuer.yaml), whose
# HTTP-01-over-Gateway solver cannot issue for an in-cluster service name.
# cert-manager's actual consumer today is the Gateway: see the
# `cert-manager.io/cluster-issuer` annotation at
# applications/platform/gateway.yaml:25.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-70"
  name: cert-manager
  namespace: argocd
  finalizers: [ resources-finalizer.argocd.argoproj.io ]
spec:
  project: default
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.16.2
    helm:
      releaseName: cert-manager
      valuesObject:
        crds:
          enabled: true
        # Enable the Gateway API integration so cert-manager can solve ACME
        # HTTP-01 via http01.gatewayHTTPRoute and auto-provision certs for
        # Gateway listeners (zeta-gateway → portal-tls). Requires the Gateway
        # API CRDs, which Cilium installs (gatewayAPI.enabled=true).
        config:
          apiVersion: controller.config.cert-manager.io/v1alpha1
          kind: ControllerConfiguration
          enableGatewayAPI: true
        replicaCount: 1
        webhook:
          replicaCount: 1
        cainjector:
          replicaCount: 1
        prometheus:
          enabled: true
          servicemonitor:
            enabled: false   # enabled once kube-prometheus-stack lands
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated: { prune: false, selfHeal: true }   # CRDs precious — no prune
    syncOptions: [ CreateNamespace=true, ServerSideApply=true ]
