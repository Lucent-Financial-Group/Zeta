# ArgoCD Sync hook: wait for Gatekeeper to register Constraint CRDs after
# ConstraintTemplates (wave 1) before Constraints (wave 3) apply.
#
# Without this, cold-start sync fails with "could not find
# constraints.gatekeeper.sh/HatWarmup" even when sync-waves are set.
#
# CRD names are `{ConstraintTemplate.metadata.name}.constraints.gatekeeper.sh`
# -- Gatekeeper uses the template name as the CRD plural, not Kubernetes
# kind-pluralisation. HatMaxNew / HatNoCycle are the footgun: guessing
# `hatmaxnews` / `hatnocycles` waits on objects that never exist. The Job
# lists are derived from policies/*.yaml; gatekeeper-crd-wait.test.ts
# refuses drift.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: gatekeeper-crd-wait
  namespace: hat-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hat-system-gatekeeper-crd-wait
  annotations:
    argocd.argoproj.io/sync-wave: "2"
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["templates.gatekeeper.sh"]
    resources: ["constrainttemplates"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hat-system-gatekeeper-crd-wait
  annotations:
    argocd.argoproj.io/sync-wave: "2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hat-system-gatekeeper-crd-wait
subjects:
  - kind: ServiceAccount
    name: gatekeeper-crd-wait
    namespace: hat-system
---
apiVersion: batch/v1
kind: Job
metadata:
  name: wait-gatekeeper-hat-constraint-crds
  namespace: hat-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: gatekeeper-crd-wait
      restartPolicy: Never
      # REQUIRED, not defensive. This namespace sets
      # pod-security.kubernetes.io/enforce: restricted (namespace.yaml), and
      # this pod template carried no securityContext at all -- so the pod was
      # REJECTED AT ADMISSION and this Job could never run. Measured in CI:
      #   pods "wait-gatekeeper-hat-constraint-crds-..." is forbidden:
      #   violates PodSecurity "restricted:latest": allowPrivilegeEscalation
      #   != false, unrestricted capabilities, runAsNonRoot != true,
      #   seccompProfile
      # all four at once. Matches the fields the sibling deployment.yaml
      # already sets, so the namespace has one shape rather than two.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      # readOnlyRootFilesystem is NOT one of the four things `restricted`
      # requires -- it is carried over from deployment.yaml as defence in
      # depth. It costs kubectl its writable discovery cache under $HOME,
      # so the cache is pointed at an emptyDir instead. Without this the fix
      # would trade an admission failure for a runtime one.
      volumes:
        - name: kubecache
          emptyDir: {}
      # WAS `bitnami/kubectl:1.32.3` (HTTP 404 after Bitnami withdrew free
      # versioned tags) then `bitnamilegacy/kubectl:1.32.3` (frozen archive).
      # `registry.k8s.io/kubectl:v1.32.3` is distroless: ENTRYPOINT
      # ["/bin/kubectl"], no shell. The wait is therefore three sequential
      # `kubectl wait` invocations (init, init, container) -- not `/bin/bash`.
      # `--for=create` landed in kubectl 1.32, which is why this pin stays
      # at v1.32.3 rather than floating.
      initContainers:
        - name: wait-templates
          image: registry.k8s.io/kubectl:v1.32.3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: HOME
              value: /tmp/kubecache
            - name: KUBECACHEDIR
              value: /tmp/kubecache/.kube/cache
          volumeMounts:
            - name: kubecache
              mountPath: /tmp/kubecache
          command: ["/bin/kubectl"]
          args:
            - wait
            - --for=create
            - --timeout=300s
            - constrainttemplate/hatcooldown
            - constrainttemplate/hatmaxbindings
            - constrainttemplate/hatconflict
            - constrainttemplate/hatquorum
            - constrainttemplate/hatwarmup
            - constrainttemplate/hatmaxnew
            - constrainttemplate/hatnocycle
        - name: wait-crd-create
          image: registry.k8s.io/kubectl:v1.32.3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: HOME
              value: /tmp/kubecache
            - name: KUBECACHEDIR
              value: /tmp/kubecache/.kube/cache
          volumeMounts:
            - name: kubecache
              mountPath: /tmp/kubecache
          command: ["/bin/kubectl"]
          args:
            - wait
            - --for=create
            - --timeout=300s
            - crd/hatcooldown.constraints.gatekeeper.sh
            - crd/hatmaxbindings.constraints.gatekeeper.sh
            - crd/hatconflict.constraints.gatekeeper.sh
            - crd/hatquorum.constraints.gatekeeper.sh
            - crd/hatwarmup.constraints.gatekeeper.sh
            - crd/hatmaxnew.constraints.gatekeeper.sh
            - crd/hatnocycle.constraints.gatekeeper.sh
      containers:
        - name: wait
          image: registry.k8s.io/kubectl:v1.32.3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: HOME
              value: /tmp/kubecache
            - name: KUBECACHEDIR
              value: /tmp/kubecache/.kube/cache
          volumeMounts:
            - name: kubecache
              mountPath: /tmp/kubecache
          command: ["/bin/kubectl"]
          args:
            - wait
            - --for=condition=Established
            - --timeout=300s
            - crd/hatcooldown.constraints.gatekeeper.sh
            - crd/hatmaxbindings.constraints.gatekeeper.sh
            - crd/hatconflict.constraints.gatekeeper.sh
            - crd/hatquorum.constraints.gatekeeper.sh
            - crd/hatwarmup.constraints.gatekeeper.sh
            - crd/hatmaxnew.constraints.gatekeeper.sh
            - crd/hatnocycle.constraints.gatekeeper.sh
