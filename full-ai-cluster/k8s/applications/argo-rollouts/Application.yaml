# Argo Rollouts — progressive delivery (canary, blue-green).

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  name: argo-rollouts
  namespace: argocd
  finalizers: [ resources-finalizer.argocd.argoproj.io ]
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-rollouts
    # 2.39.5 -> 2.43.0 on 2026-09-01. Rendered at BOTH versions with this
    # Application's own valuesObject: no value stopped taking effect and no
    # resource was removed. Safe as an INSTALL version -- see the batch PR for
    # why a fresh cluster does not walk this chart's upgrade path.
    targetRevision: 2.43.0
    helm:
      releaseName: argo-rollouts
      valuesObject:
        controller:
          replicas: 1
        dashboard:
          enabled: true
          serviceType: ClusterIP
        notifications:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [ CreateNamespace=true, ServerSideApply=true ]
