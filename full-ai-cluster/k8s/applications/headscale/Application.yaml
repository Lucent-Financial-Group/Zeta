# Headscale — self-hosted Tailscale control server (the SOVEREIGN network-plane control,
# Aaron 2026-06-10: "we are using Reticulum and Headscale ... lets get headscale in argocd
# then — that's in repo we close over it that way").
#
# Runs on the zetacluster (k3s/ArgoCD); the PC gets the `tailscale` client + `headscale-cli`
# (declared in tools/setup/manifests/brew). This Application is the SERVER half — closed over
# in-repo so the whole network plane is declarative.
#
# Chart: gabe565/headscale (https://charts.gabe565.com), the widely-used community chart
# (bjw-s common library). Version pinned per dep-pin-search-first (ArtifactHub 2026-06-10:
# latest = 0.4.0). NOT upstream-maintained — chart issues go to gabe565/charts.
#
# OPERATOR TODO before first real use (Max owns the corporate/domain side):
#   - set config.server_url to the headscale subdomain on the ACME/Let's-Encrypt domain
#     cert-manager already serves (e.g. https://headscale.<zeta-domain>).
#   - provision OIDC / pre-auth keys + the noise private key as a Sealed Secret / Vault.
#   - confirm Ingress + cert-manager annotations for that subdomain.
# Conservative syncPolicy (prune:false) until server_url + secrets are set, mirroring redis.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1" # after core infra (longhorn/cilium) at wave 0
  name: headscale
  namespace: argocd
  finalizers: [ resources-finalizer.argocd.argoproj.io ]
spec:
  project: default
  source:
    # MOVED HOME, 2026-09-05 -- this is a REPOINT, not a bump, and the old
    # coordinate is dead rather than dormant.
    #
    # `docs/CHART-CURRENCY.md` labelled this row DORMANT for 563 days, which was
    # a true fact about the COORDINATE and a misleading one about the PROJECT.
    # Aaron 2026-09-02: "i read headscale is still supported not unsupport fyi" --
    # and he was right. headscale is actively developed; `charts.gabe565.com` is a
    # third-party personal chart repo whose WHOLE INDEX is dead: `max(created)`
    # across all 39 of its charts is 2025-02-19. The full measurement, including a
    # correction that first read the repo as alive in the ACQUITTING direction, is
    # workitem 081M1HH1ERN087G0R00309EG9D.
    #
    #   was   charts.gabe565.com/headscale  0.16.0   appVersion v0.25.0
    #   now   wrenix/helm-charts/headscale  1.0.19   appVersion 0.29.3
    #
    # NO `oci://` SCHEME ON THE repoURL, and that is not cosmetic. Written as
    # `oci://codeberg.org/...` the render tooling built
    # `https://oci/v2/wrenix/...` -- it read `oci` as the HOST -- and headscale
    # became the tree's only unrenderable Application. The three OCI charts that
    # already work here (`arc-controller`, `arc-runner-set`, `hindsight` on
    # `ghcr.io/...`) all use the bare-host form, so this matches them.
    #
    # So the repoint is worth FOUR MINOR SERVER RELEASES, which no chart-version
    # bump could ever have delivered -- the coordinate we were pinned to has no
    # newer version to move to. That is the general defect the work item names:
    # CHART currency is not APP currency, and the report only measures the first.
    #
    # THE VALUES ARE REWRITTEN, not carried across, because it is a different
    # chart with a different surface. Two settings had to move:
    #
    #   persistence.config.{enabled,type,accessMode,storageClass,size}
    #     -> persistence.{enabled,accessMode,storageClass,size}   (flat here)
    #   env.HEADSCALE_SERVER_URL
    #     -> headscale.config.server_url                          (real config,
    #        not an env var -- which is Aaron's "headscale with config")
    #
    # `disable_check_updates` is kept at the chart's own default of true: a
    # cluster component phoning home for version checks is an undeclared channel.
    repoURL: codeberg.org/wrenix/helm-charts
    chart: headscale
    targetRevision: 1.0.19
    helm:
      releaseName: headscale
      valuesObject:
        persistence:
          enabled: true
          accessMode: ReadWriteOnce
          storageClass: longhorn
          size: 3Gi
        headscale:
          certmanager:
            # OFF. The dev lane has no ClusterIssuer named `letsencrypt-prod`,
            # and the chart's default would render a Certificate referencing one
            # that does not exist. TLS termination is the ingress's job here.
            enabled: false
          config:
            server_url: https://headscale.zeta.local
  destination:
    server: https://kubernetes.default.svc
    namespace: headscale
  syncPolicy:
    automated: { prune: false, selfHeal: true }
    syncOptions: [ CreateNamespace=true, ServerSideApply=true ]
