# flowdent.net / www.flowdent.net -- the public Next.js website (fd-webclient), moved off Azure
# Container Apps (`flowdent-webapp`).
#
# THE IMAGE is a byte-for-byte copy of what Azure was SERVING on 2026-10-02 (revision
# flowdent-webapp--0000113, source fd-webclient@672c0d13): same manifest digest sha256:eb977e99...,
# pushed to this cluster's registry. It is pinned by digest, so a re-tag cannot change what runs.
# NOT the `latest` / 06a4d160 tag in Azure's repo: that tag is a Blazor WebAssembly host built from
# fd-core by the old GitHub workflow, which is why Azure's newest revision (--0000115) has been
# Failed since 2026-09-17 while --0000113 kept serving. docs/ops/AZURE-EXIT.md.
#
# The pull Secret `flowdent-registry` is NOT in git (it holds a registry credential); it is copied from
# the flowdent namespaces by the operator -- docs/ops/AZURE-EXIT.md "Bring-up".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowdent-web
  namespace: flowdent-web
  labels:
    app.kubernetes.io/name: flowdent-web
    app.kubernetes.io/part-of: flowdent
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: flowdent-web
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flowdent-web
        app.kubernetes.io/part-of: flowdent
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      priorityClassName: flowdent-prod
      imagePullSecrets:
        - name: flowdent-registry
      securityContext:
        runAsNonRoot: true
        # The image's own `nextjs` user (uid 1001). Numeric, so the kubelet can verify non-root.
        runAsUser: 1001
        runAsGroup: 65533
        fsGroup: 65533
        seccompProfile: { type: RuntimeDefault }
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: { app.kubernetes.io/name: flowdent-web }
      terminationGracePeriodSeconds: 30
      containers:
        - name: web
          image: registry.flowdent.net/flowdent/fd-webclient/flowdent-webapp:672c0d13afa2@sha256:eb977e99014405e7eb49524890f09788d59a0f8a9d414d2fc749c02889faf2fb
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 3000, protocol: TCP }
          env:
            # The same non-secret settings Azure carried (the ASPNETCORE_* pair was dead weight on a
            # Node image and is dropped). NEXT_PUBLIC_* values are baked into the image at build time.
            - { name: NODE_ENV, value: production }
            - { name: PORT, value: "3000" }
            - { name: HOSTNAME, value: 0.0.0.0 }
            - { name: NEXT_TELEMETRY_DISABLED, value: "1" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          resources:
            requests: { cpu: 50m, memory: 128Mi, ephemeral-storage: 64Mi }
            limits: { memory: 512Mi, ephemeral-storage: 256Mi }
          lifecycle:
            preStop:
              exec: { command: ["sleep", "5"] }
          startupProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            # Next.js writes its image-optimiser / ISR cache here; everything else in /app is read-only.
            - { name: next-cache, mountPath: /app/.next/cache }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        - name: next-cache
          emptyDir: { sizeLimit: 128Mi }
