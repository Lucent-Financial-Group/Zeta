# infra/k8s/applications/root-application.yaml
#
# App-of-Apps root. ArgoCD reads this on first boot (auto-applied by K3S via
# services.k3s.manifests) and starts watching for ArgoCD Application CRs.
#
# ── IT NOW WATCHES full-ai-cluster/k8s/applications, AND THAT IS THE POINT ──────
#
# This file and full-ai-cluster/k8s/bootstrap/root-application.yaml declare THE
# SAME OBJECT: `Application/zeta-root` in namespace `argocd`. They are not two
# trees -- they are two definitions of one Application that disagreed about which
# directory it watches, and whichever was applied last won:
#
#   on METAL   K3S auto-applies THIS file  -> zeta-root watched infra/k8s/applications   (7 apps)
#   in CI      the lanes apply the other   -> zeta-root watches full-ai-cluster/...     (50 apps)
#
# So the cluster CI proved green and the cluster a reformatted box would boot were
# DIFFERENT CLUSTERS, and every hour spent getting 50 Applications healthy in CI
# would have deployed 7 of them on metal. Nothing was lying; the two files simply
# never had to agree, because nothing compared them.
#
# The 7 are gone rather than reconciled: 6 had counterparts in
# full-ai-cluster/k8s/applications ALREADY BETTER ORDERED (longhorn -15, argo-*
# and cockroachdb 0, orleans 10, gitlab 30) where these declared no sync-wave at
# all, and the 7th -- local-path-provisioner -- duplicated a provisioner K3S ships
# built-in and which infra/nixos/modules/k3s-server.nix does NOT disable (it
# disables servicelb and traefik only). Its own header said so.
#
# Adding a new workload: drop an Application.yaml under
# full-ai-cluster/k8s/applications/<name>/ and commit. One directory, one root,
# one cluster shape.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zeta-root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Lucent-Financial-Group/Zeta
    targetRevision: main
    path: full-ai-cluster/k8s/applications
    directory:
      recurse: true
      # Only pick up Application CRs at any depth, not the workload
      # manifests sitting next to them.
      include: '{*/Application.yaml,Application.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
