name: bytelock-toolchain-probe

# TEMPORARY MEASUREMENT WORKFLOW — deleted before this PR merges.
#
# It answers one question the byte-lock cannot answer from the shared checkout: WHICH of the
# six committed `.wasm` substrates can each CI leg actually BUILD, and at what install cost.
# `src/wasm-dla/bytelock/.gitignore` states the trade the six were committed under — "add a
# toolchain to the workflow and the corresponding file should stop being tracked, not start
# being trusted" — and this measures whether that toolchain exists per leg.
#
# It NEVER fails. A probe that goes red teaches nothing; every step reports and continues, and
# the verdict is read out of the log table.

on:
  push:
    branches: [agent/wasm-build-in-ci]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: bytelock-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: probe (${{ matrix.os }})
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-26, windows-2025, windows-11-arm]

    steps:
      - name: Enable Windows long paths (before checkout)
        if: startsWith(matrix.os, 'windows')
        shell: bash
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preinstalled inventory
        shell: bash
        run: |
          echo "=== PREINSTALLED on ${{ matrix.os }} (${{ runner.arch }}) ==="
          for t in node npm npx rustc rustup cargo clang wasm-ld lld zig emcc wat2wasm go python3; do
            printf '%-10s ' "$t"
            if command -v "$t" >/dev/null 2>&1; then
              printf 'PRESENT  %s  ' "$(command -v "$t")"
              ("$t" --version 2>&1 | head -1) || echo ""
            else
              echo "ABSENT"
            fi
          done

      # ── wabt (WAT substrate) — already installed by bytelock.yml on every leg ──
      - name: Install wabt (timed)
        shell: bash
        run: |
          start=$(date +%s)
          case "${{ runner.os }}" in
            Linux)   sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends wabt || true ;;
            macOS)   brew install wabt || true ;;
            Windows) choco install -y wabt --no-progress >/dev/null 2>&1 || true ;;
          esac
          echo "WABT_INSTALL_SECONDS=$(( $(date +%s) - start ))"
          command -v wat2wasm && wat2wasm --version || echo "wat2wasm: STILL ABSENT"

      # ── LLVM/clang with a wasm32 target + wasm-ld ─────────────────────────────
      - name: Install clang/lld for wasm32 (timed)
        shell: bash
        run: |
          start=$(date +%s)
          case "${{ runner.os }}" in
            Linux)   sudo apt-get install -y --no-install-recommends clang lld || true ;;
            macOS)   brew install llvm lld || true
                     echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
                     export PATH="$(brew --prefix llvm)/bin:$PATH" ;;
            Windows) choco install -y llvm --no-progress >/dev/null 2>&1 || true ;;
          esac
          echo "CLANG_INSTALL_SECONDS=$(( $(date +%s) - start ))"
          command -v clang && clang --version | head -1 || echo "clang: ABSENT"
          command -v wasm-ld && wasm-ld --version || echo "wasm-ld: ABSENT"

      # ── Rust wasm32 target ────────────────────────────────────────────────────
      - name: Add rust wasm32 target (timed)
        shell: bash
        run: |
          start=$(date +%s)
          rustup target add wasm32-unknown-unknown || echo "rustup target add: FAILED"
          echo "RUST_TARGET_SECONDS=$(( $(date +%s) - start ))"
          rustc --version || true
          rustup target list --installed || true

      # ── AssemblyScript ────────────────────────────────────────────────────────
      - name: Install AssemblyScript (timed)
        shell: bash
        working-directory: src/wasm-dla/bytelock
        run: |
          start=$(date +%s)
          npm install --no-save --no-audit --no-fund assemblyscript@0.28.8 || echo "npm install asc: FAILED"
          echo "ASC_INSTALL_SECONDS=$(( $(date +%s) - start ))"
          ./node_modules/.bin/asc --version || echo "asc: ABSENT"

      # ── Zig, pinned to .mise.toml's zig = "0.13.0" ────────────────────────────
      - name: Install zig 0.13.0 (timed)
        shell: bash
        run: |
          start=$(date +%s)
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64)    Z=zig-linux-x86_64-0.13.0;    EXT=tar.xz ;;
            Linux-ARM64)  Z=zig-linux-aarch64-0.13.0;   EXT=tar.xz ;;
            macOS-ARM64)  Z=zig-macos-aarch64-0.13.0;   EXT=tar.xz ;;
            macOS-X64)    Z=zig-macos-x86_64-0.13.0;    EXT=tar.xz ;;
            Windows-X64)  Z=zig-windows-x86_64-0.13.0;  EXT=zip ;;
            Windows-ARM64) Z=zig-windows-aarch64-0.13.0; EXT=zip ;;
            *) echo "UNKNOWN PLATFORM"; exit 0 ;;
          esac
          url="https://ziglang.org/download/0.13.0/${Z}.${EXT}"
          echo "fetching $url"
          if curl -fsSL --retry 3 -o "/tmp/zig.${EXT}" "$url"; then
            mkdir -p /tmp/zigdir
            if [ "$EXT" = "zip" ]; then unzip -q "/tmp/zig.${EXT}" -d /tmp/zigdir; else tar -xJf "/tmp/zig.${EXT}" -C /tmp/zigdir; fi
            echo "/tmp/zigdir/${Z}" >> "$GITHUB_PATH"
            export PATH="/tmp/zigdir/${Z}:$PATH"
            echo "ZIG_BYTES=$(wc -c < /tmp/zig.${EXT})"
            zig version || echo "zig: broken"
          else
            echo "zig download: FAILED"
          fi
          echo "ZIG_INSTALL_SECONDS=$(( $(date +%s) - start ))"

      # ── Emscripten — the expensive one, measured rather than assumed ──────────
      - name: Install emscripten (timed)
        shell: bash
        run: |
          start=$(date +%s)
          case "${{ runner.os }}" in
            Linux)   sudo apt-get install -y --no-install-recommends emscripten || echo "apt emscripten: FAILED" ;;
            macOS)   brew install emscripten || echo "brew emscripten: FAILED" ;;
            Windows) echo "no choco emscripten package attempted — emsdk only" ;;
          esac
          echo "EMCC_PKG_SECONDS=$(( $(date +%s) - start ))"
          command -v emcc && (emcc --version | head -1) || echo "emcc: ABSENT after package install"

      - name: Install emscripten via emsdk (timed, fallback)
        shell: bash
        run: |
          if command -v emcc >/dev/null 2>&1; then echo "emcc already present — emsdk not attempted"; exit 0; fi
          start=$(date +%s)
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git /tmp/emsdk || { echo "emsdk clone FAILED"; exit 0; }
          ( cd /tmp/emsdk && ./emsdk install latest && ./emsdk activate latest ) || echo "emsdk install FAILED"
          echo "EMSDK_SECONDS=$(( $(date +%s) - start ))"
          echo "EMSDK_DISK_BYTES=$(du -sk /tmp/emsdk 2>/dev/null | cut -f1) KiB"
          # shellcheck disable=SC1091
          . /tmp/emsdk/emsdk_env.sh >/dev/null 2>&1 || true
          command -v emcc && (emcc --version | head -1) || echo "emcc: ABSENT after emsdk"
          echo "$(dirname "$(command -v emcc 2>/dev/null || echo /nonexistent/x)")" >> "$GITHUB_PATH" || true

      # ── Build each substrate from committed source, into a SCRATCH name ───────
      - name: Build every substrate from source (each independently reported)
        shell: bash
        working-directory: src/wasm-dla/bytelock
        run: |
          # shellcheck disable=SC1091
          [ -f /tmp/emsdk/emsdk_env.sh ] && . /tmp/emsdk/emsdk_env.sh >/dev/null 2>&1 || true
          export PATH="$PWD/node_modules/.bin:$PATH"
          mkdir -p /tmp/built
          try () { # name, then command
            local n="$1"; shift
            printf 'BUILD %-16s ' "$n"
            if "$@" >/tmp/build-$n.log 2>&1; then echo "OK"; else echo "FAILED"; tail -5 /tmp/build-$n.log | sed 's/^/    | /'; fi
          }
          try WAT wat2wasm dla-canonical.wat -o /tmp/built/dla-canonical-wat.wasm
          try LLVM clang --target=wasm32 -nostdlib -Wl,--no-entry -Wl,--allow-undefined -Wl,--export-all -O2 -o /tmp/built/dla-canonical-llvm.wasm dla-canonical.c
          try RUST rustc --edition 2021 --target wasm32-unknown-unknown -C opt-level=s -C strip=debuginfo -C link-args=--allow-undefined -C panic=abort --crate-type cdylib -o /tmp/built/dla-canonical-rust.wasm dla-canonical.rs
          try ASC asc dla-canonical.ts --outFile /tmp/built/dla-canonical-asc.wasm --optimize --noAssert --runtime stub
          try ZIG zig build-exe dla-canonical.zig -target wasm32-freestanding -O ReleaseSmall -fno-entry --export=init --export=run --export=get_cluster_size --export=get_max_r_bits --export=get_trajectory_entry -femit-bin=/tmp/built/dla-canonical-zig.wasm
          try EMCC emcc -O2 -s WASM=1 -s STANDALONE_WASM=1 --no-entry -s ERROR_ON_UNDEFINED_SYMBOLS=0 "-sEXPORTED_FUNCTIONS=['_init','_run','_get_cluster_size','_get_max_r_bits','_get_trajectory_entry']" -o /tmp/built/dla-canonical-emcc.wasm dla-canonical.c
          echo "=== BUILT ARTEFACTS ==="
          ls -l /tmp/built/ 2>/dev/null || echo "(none)"
          echo "=== BYTE-IDENTICAL TO THE COMMITTED ONE? ==="
          for f in wat llvm rust asc zig emcc; do
            printf '%-6s ' "$f"
            if [ -f "/tmp/built/dla-canonical-$f.wasm" ]; then
              if cmp -s "/tmp/built/dla-canonical-$f.wasm" "dla-canonical-$f.wasm"; then echo "IDENTICAL"; else
                echo "DIFFERENT (built $(wc -c < /tmp/built/dla-canonical-$f.wasm) vs committed $(wc -c < dla-canonical-$f.wasm))"; fi
            else echo "NOT BUILT"; fi
          done

      # ── Does a REBUILT substrate still satisfy the UNCHANGED golden vectors? ──
      - name: Byte-lock the REBUILT substrates against unchanged golden vectors
        shell: bash
        working-directory: src/wasm-dla/bytelock
        env:
          BYTELOCK_MIN_SUBSTRATES: "1"
        run: |
          for f in wat llvm rust asc zig emcc; do
            [ -f "/tmp/built/dla-canonical-$f.wasm" ] && cp "/tmp/built/dla-canonical-$f.wasm" "dla-canonical-$f.wasm" || echo "keeping committed dla-canonical-$f.wasm (rebuild absent)"
          done
          node run-bytelock-ci.mjs || echo "runner exit=$?"
