# LD001 self-healer — regenerate bun.lock when package.json has moved without it.
#
# Aaron 2026-08-10: "lets drift detect this on our auto heal cluster too if possible
# one of our low no intelligence auto healers if we can and drift" / "the self heal
# stuff should be running 24 7 with our little free agent society on github actions".
#
# WHY THIS CLASS EARNED A HEALER
# ------------------------------
# It turned main red TWICE on 2026-08-10, in both directions:
#   c101a6ac9  ADDED two dependencies, no lockfile update
#   47095a706  REMOVED one dependency, no lockfile update
# Every consumer runs `bun install --frozen-lockfile`, which fails closed, so the
# build breaks for everyone until a human notices. Both times, a human noticing WAS
# the recovery mechanism. This replaces that with a machine.
#
# WHY IT IS SAFE TO AUTOMATE — the properties that make it "no intelligence"
# -------------------------------------------------------------------------
# The auto-revert healer is deliberately gated because reverting main can erase work
# other lanes built on. This healer has none of that blast radius, and the reasons
# are checkable rather than asserted:
#
#   1. ONE GENERATED FILE. It stages `bun.lock` and nothing else. `package.json` —
#      the human's actual intent — is never touched, and the job FAILS if it moved.
#   2. NO JUDGEMENT. The fix is `bun install`. There is no choice to make, no
#      candidate to select, no diff to interpret.
#   3. IDEMPOTENT. Running it twice is a no-op: the second run finds nothing to
#      commit. Apply-N-times == apply-once (§12).
#   4. SELF-VERIFYING. It re-runs `--frozen-lockfile` AFTER healing and refuses to
#      push unless that passes. It cannot commit a lockfile that does not fix the
#      problem it was summoned for.
#   5. CONVERGENT AND REVERSIBLE. The output is a pure function of package.json at
#      that commit; a wrong result is one `git revert` away and erases no one's work.
#
# It also refuses rather than guesses: a network failure or a missing binary is
# INDETERMINATE, never desync (see audit-lockfile-sync.ts `classify`), so a registry
# blip can never trick it into rewriting a lockfile that was correct.
#
# 24/7 CADENCE
# ------------
# Scheduled every 17 minutes (off-minute, per the thundering-herd convention) so the
# society is always watching, PLUS an immediate trigger on any push to main that
# touches package.json or bun.lock — so the common case heals in one build cycle
# rather than waiting for the next tick.
#
# HOW IT LANDS (changed 2026-08-22 — it previously could not land at all)
# ----------------------------------------------------------------------
# This lane used to end in `git push origin HEAD:main`. That push cannot succeed:
# ruleset "CI Gate" (16134995) makes `gate (required)` a required status check on
# `main`, and a required check is evaluated at PUSH time against the pushed tip, so
# a commit that has never been through a check run is rejected before any check
# could start:
#
#     remote: - Required status check "gate (required)" is expected.
#
# The lane was nonetheless GREEN, because it only reaches the push on real lockfile
# drift and its last heal landed 2026-08-09 — it was green for never doing its work,
# and would have failed the first time it was actually needed. That is the vacuity
# class: a check that cannot fail is not a check, and a lane that is green because it
# no-ops is not a healed lane.
#
# It now lands the same way `tick-metrics`, `society` and the three cadences fixed in
# #13808 do: `flush-via-staging.ts` parks the regenerated lockfile on
# `heartbeat/lockfile-healer` and opens a PR with squash auto-merge armed. `gate`
# runs on that PR — and it passes there precisely because the PR head carries the
# healed lockfile — then GitHub squashes it onto main. The ruleset is not weakened
# and nothing is disabled; the route is simply the legal one.
#
# COST OF THE CHANGE, STATED HONESTLY: a heal is no longer one push away, it is one
# PR away, so the fix arrives a gate-run later than the old design intended. That
# design's speed was never real — the push it depended on had been rejected since the
# ruleset landed.
#
# Loop safety: the flush commit deliberately carries NO `[skip ci]`. On a direct push
# to main it was harmless; on this route it is fatal, because it would suppress the
# `pull_request` run of `gate` and the required check would never report, leaving the
# PR unmergeable forever. `flush-via-staging.ts` refuses a skip token outright.

name: lockfile-healer

on:
  schedule:
    - cron: "*/17 * * * *"
  push:
    branches: [main]
    paths:
      - "package.json"
      - "bun.lock"
      - ".github/workflows/lockfile-healer.yml"
  workflow_dispatch: {}

permissions:
  contents: write # pushes the heartbeat/lockfile-healer staging branch
  pull-requests: write # opens the flush PR that carries the heal onto main

concurrency:
  group: lockfile-healer
  cancel-in-progress: false # never cancel a heal mid-push

jobs:
  heal:
    name: LD001 — heal bun.lock desync
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # Start from `origin/main` unioned with anything still parked on
      # `heartbeat/lockfile-healer` from a previous heal whose PR has not landed yet.
      # Without the union, a second heal arriving while the first PR is still waiting
      # on `gate` would reset to main, regenerate, and force-push over content that had
      # not landed — and the detect below would re-diagnose a desync that is already
      # fixed and queued.
      - name: Prepare staging working tree
        run: bun src/Core.TypeScript/forge-host/github/flush-via-staging.ts prepare --lane lockfile-healer

      - name: Detect (authoritative — the same command every consumer runs)
        id: detect
        run: |
          set +e
          bun src/Core.TypeScript/hygiene/audit-lockfile-sync.ts --human
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            0) echo "in sync — nothing to heal" ;;
            1) echo "DESYNC detected — healing" ;;
            *) echo "INDETERMINATE — refusing to touch the lockfile" ;;
          esac

      - name: Heal
        if: steps.detect.outputs.code == '1'
        run: bun install

      - name: Refuse if anything but bun.lock moved
        if: steps.detect.outputs.code == '1'
        run: |
          # The healer's entire safety case rests on this. `bun install` should only
          # ever rewrite the lockfile; if it has touched package.json or anything
          # else, the situation is not the one this healer was built for and a human
          # should look.
          #
          # Stated as "nothing OTHER than bun.lock moved" rather than "the changed set
          # IS exactly bun.lock". The safety property is the same one — package.json is
          # untouched — but the exact-equality form became wrong once `prepare` runs
          # first: a heal still parked on the staging branch arrives ALREADY STAGED in
          # the index, so if `bun install` reproduces it byte-for-byte the unstaged diff
          # is empty and the old test failed the run for healing correctly. Staged and
          # unstaged are both inspected, so nothing can hide in the index either.
          other=$(git status --porcelain -- . | awk '{ print $NF }' | grep -v '^bun\.lock$' || true)
          if [ -n "$other" ]; then
            echo "::error::expected only bun.lock to change, got: $other"
            exit 1
          fi

      - name: Verify the heal actually heals
        if: steps.detect.outputs.code == '1'
        run: |
          # Self-verification: refuse to push a lockfile that does not resolve the
          # very condition that summoned the healer.
          bun install --frozen-lockfile

      - name: Flush the heal to main via staging branch + PR
        if: steps.detect.outputs.code == '1'
        env:
          # The enterprise forbids the Actions identity from creating pull requests, so
          # a fine-grained PAT is required to OPEN the PR. Without one the healed
          # lockfile still parks safely on `heartbeat/lockfile-healer` and the step
          # reports why it could go no further — the heal is never lost, only delayed.
          GH_TOKEN: ${{ secrets.ZETA_TELEMETRY_FLUSH_TOKEN || secrets.ZETA_PR_ARCHIVE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          bun src/Core.TypeScript/forge-host/github/flush-via-staging.ts flush \
            --lane lockfile-healer \
            --paths bun.lock \
            --message "fix(deps): regenerate bun.lock (LD001 auto-heal)"

      - name: Summary
        if: always()
        run: |
          {
            echo "## LD001 lockfile healer"
            echo
            case "${{ steps.detect.outputs.code }}" in
              0) echo "In sync — no action." ;;
              1) echo "**Healed.** bun.lock regenerated, verified, and flushed to \`heartbeat/lockfile-healer\` for a squash-merge PR onto main." ;;
              *) echo "**Indeterminate** — bun could not determine sync state. Refused to act; no lockfile was written." ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
