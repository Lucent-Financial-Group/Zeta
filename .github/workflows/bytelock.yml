name: bytelock

# N-ORACLE BYTE-LOCK — a DRIFT CHECK, not a gate.
#
# WHY DRIFT AND NOT A GATE (Aaron asked directly, 2026-08-01):
#   1. Architecture. Zeta is moving off forge hosts toward git-native then zetadb-native.
#      "CI gates are for corporate jobs, not sovereign ones." The discipline is RETRACTION
#      OVER PREVENTION: a divergence is noticed and healed, not forbidden by an authority.
#   2. It runs on `push: main`, i.e. POST-MERGE — it cannot gate anything by construction.
#   3. Empirically decisive: before the 2026-08-01 fix this runner reported
#      "Byte-lock FAILED — divergences found" when the only cause was
#      `lua5.4: command not found`. As a required gate, one runner missing a toolchain
#      would block all work; as a drift signal it is simply information.
#   4. A real byte divergence is usually something you WANT TO KNOW (a Zig upgrade changed
#      float rounding), not something to prevent. Blocking would hide the finding.
#
# WHAT IS HARD — LIVENESS, NOT THE RESULT:
#   The hazard is not divergence. It is the byte-lock going GREEN WHILE VERIFYING NOTHING
#   (missing .wasm artefacts, every substrate skipped). "Verified 0 of 10" must never read
#   as success — that is exactly the false-green shape that put six unfalsifiable
#   "discharges" into the frozen core on 2026-08-01. So the runner exits 2 when fewer than
#   BYTELOCK_MIN_SUBSTRATES actually executed, and THAT is what fails this job.
#
#   exit 0 = agreed (or diverged — reported as drift)
#   exit 1 = diverged AND BYTELOCK_STRICT=1 (not set here)
#   exit 2 = LIVENESS FAILURE — too few substrates ran. This is the failure that matters.
#   exit 3 = MALFORMED ARTEFACT — a substrate binary is not loadable, so it verified nothing.
#   exit 4 = REFERENCE DRIFT — reference.mjs no longer reproduces a COMMITTED golden vector.
#
# WHAT EXIT 4 IS FOR (added 2026-08-16, and it was a live hole, not a hypothetical):
#   `testdata/golden-seed-{1,42,100,999}.json` are the byte-lock's hex-in-JSON vectors — the
#   artifact `.claude/rules/no-binary-in-proof-lineage.md` exists to require. NOTHING READ THEM.
#   The runner recomputed its expectation from `reference.mjs` on every run, so it was grading
#   its own homework: edit the reference, rebuild the substrates from source, and all nine agree
#   with the new answer. "Byte-lock AGREED — 9 of 9", green, with the locked trajectory moved and
#   no diff anywhere a reviewer looks. The four files that would have shown it as a readable hex
#   diff were sitting in the directory, unopened.
#
#   So the pin is HARD while divergence stays soft, and it runs BEFORE any substrate. A
#   substrate disagreeing is a finding about a compiler and you want it delivered. The reference
#   disagreeing with its own committed vector is a finding about the MEASURING STICK, and every
#   comparison downstream of it is unearned — the same asymmetry that makes exit 3 hard.
#   Intended trajectory change → regenerate the vectors in the same commit.
#
# WHAT EXIT 3 IS FOR (added 2026-08-15, and it had already happened):
#   `dla-canonical-zig.wasm` was committed as an `ar` archive (`!<arch>`), the unlinked
#   `zig build-lib` intermediate. It could not load in ANY run, yet it counted toward
#   `executed`, so the summary claimed "1 of 8 executed" when 7 substrates had compared a
#   vector and the eighth had only ever thrown at load. A load failure arrived through the
#   same channel as a byte divergence, and divergence is deliberately non-fatal here — so
#   the job went green for two weeks over a substrate that verified nothing.
#   A broken instrument is not a soft finding. It stops the run.

on:
  push:
    branches: [main]
    paths:
      - "src/wasm-dla/**"
      - ".github/workflows/bytelock.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: bytelock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bytelock:
    name: byte-lock (${{ matrix.os }})
    timeout-minutes: 25
    runs-on: ${{ matrix.os }}
    strategy:
      # fail-fast MUST stay false. The cross-processor job below compares legs
      # against each other, so cancelling siblings when one fails would destroy
      # exactly the evidence the comparison needs -- and the interesting case is
      # precisely a leg that fails while others pass.
      fail-fast: false
      matrix:
        include:
          # ALL THREE LEGS ARE NOW CALIBRATED FROM A MEASUREMENT, not from a guess.
          #
          # They shipped on 2026-09-05 with the two new legs at min 1 and no required
          # list, marked UNCALIBRATED, because nobody had measured what those runners
          # execute and inventing a number would be asserting instead of reading. Run
          # 33991852357 measured it, and these are that reading:
          #
          #   ubuntu-24.04       9 executed, 9 pass
          #   ubuntu-24.04-arm   9 executed, 9 pass
          #   macos-26           8 executed, 8 pass, Lua 5.4 TOOLING-ABSENT
          #
          # The promise made when the placeholder landed ("RAISE THESE once the first
          # runs report") is kept here. A permanently-1 floor would have been the
          # check-that-cannot-fail this matrix exists to defeat.
          #
          # GO IS NOW IN THE REQUIRED LIST, and its absence was a real gap rather than
          # a new addition. The old list carried eight names with the note "Go is
          # DECLARED ABSENT ... Add it to this list in the same change that builds
          # it." The build step landed; the list never followed. Go executed on all
          # three legs in the measured run, so the identity floor now covers it. The
          # aggregate floor of 9 would have caught Go going dark; the per-route list
          # would not have NAMED it, which is the whole reason that list exists.
          - os: ubuntu-24.04
            min_substrates: "9"
            required_substrates: "WAT,LLVM/C,Emscripten,Rust,AssemblyScript,Zig,JS (V8),Lua 5.4,Go"
          - os: ubuntu-24.04-arm
            min_substrates: "9"
            required_substrates: "WAT,LLVM/C,Emscripten,Rust,AssemblyScript,Zig,JS (V8),Lua 5.4,Go"
          # macOS reached 9 on run 33992105626 and this floor rose to match, in the
          # same session that set it to 8 -- which is the discipline working rather
          # than a correction. The 8 was the value OBSERVED at the time: `lua5.4` was
          # absent because Homebrew's `lua` formula installs 5.5 as `lua` while the
          # substrate shells out to `lua5.4` by name. The brew step was changed to
          # install `lua@5.4` specifically and put it on PATH; the next run measured
          # 9, and the comment here promised "THIS FLOOR MUST RISE TO MATCH".
          #
          # All three legs now execute the same nine substrates, which is what makes
          # the cross-processor comparison maximally wide: 36 shared (substrate, seed)
          # pairs rather than a subset limited by the weakest toolchain.
          - os: macos-26
            min_substrates: "9"
            required_substrates: "WAT,LLVM/C,Emscripten,Rust,AssemblyScript,Zig,JS (V8),Lua 5.4,Go"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install substrate toolchains (apt)
        if: startsWith(matrix.os, 'ubuntu')
        # wat2wasm (wabt) and lua5.4 are the two the runner shells out to; node runs the
        # WASM substrates and the JS reference. A toolchain that fails to install shows up
        # as TOOLING-ABSENT (not a divergence) and reduces the executed count.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends wabt lua5.4

      - name: Install substrate toolchains (brew)
        if: startsWith(matrix.os, 'macos')
        # Same two toolchains, this OS's package manager. `|| true` is deliberate and is
        # NOT a swallowed error: a toolchain that fails to install must surface as
        # TOOLING-ABSENT in the report -- which is a measured fact about this runner and
        # is exactly what the cross-processor comparison needs to see -- rather than as a
        # dead job with no report to compare.
        run: |
          brew install wabt || true
          # `lua@5.4` SPECIFICALLY, not `lua`. Measured in run 33991852357: the plain
          # formula installs 5.5 as `lua`, the substrate shells out to `lua5.4` by
          # name, and the leg reported Lua 5.4 TOOLING-ABSENT -- honestly, and with
          # the count reduced, which is the behaviour we want from a missing
          # toolchain. This is the attempt to supply it rather than to accept the 8.
          brew install lua@5.4 || brew install lua || true
          LUA_PREFIX="$(brew --prefix lua@5.4 2>/dev/null || true)"
          if [ -n "$LUA_PREFIX" ] && [ -x "$LUA_PREFIX/bin/lua5.4" ]; then
            echo "$LUA_PREFIX/bin" >> "$GITHUB_PATH"
          fi
          command -v wat2wasm || echo "wat2wasm: ABSENT on this runner"
          command -v lua5.4 || echo "lua5.4: ABSENT on this runner (leg measures 8, not 9)"

      # THE GO SUBSTRATE HAD NEVER EXECUTED IN CI. `run-go-wasm.mjs` needs
      # `dla-canonical-go.wasm`; that artefact was neither committed nor built here, so Go
      # reported TOOLING-ABSENT on every run from the day it joined the roster while
      # `executed >= 2` stayed satisfied by the others. It sat in the roster contributing
      # nothing.
      #
      # It is BUILT rather than COMMITTED, and that is deliberate. The Go artefact is
      # ~1.9 MB — 1,500× the Zig module and 4× the largest binary already in this
      # directory — and `src/wasm-dla/bytelock/.gitignore` already states the intent that
      # compiled substrates are "built by CI/local toolchain, not stored in repo". Building
      # it from the committed 3.8 KB `dla-canonical.go` keeps the reviewable artefact TEXT
      # (`.claude/rules/no-binary-in-proof-lineage.md` in spirit: the proof lineage should
      # not rest on bytes a reviewer cannot read) and makes the substrate reproducible
      # rather than trusted.
      #
      # The version is pinned to `.mise.toml`'s `go = "1.26.4"`. This is a PARITY
      # REQUIREMENT, not a preference: `wasm_exec.js` is the Go runtime's own JS bridge and
      # is committed alongside the source, so it must come from a compatible Go. Bump both
      # together or the harness fails at boot.
      - name: Setup Go (pinned to .mise.toml — must match the committed wasm_exec.js)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.4"
          cache: false

      - name: Build the Go WASM substrate
        working-directory: src/wasm-dla/bytelock
        # `build-substrates.mjs` checks the exit status AND the emitted file's WebAssembly
        # header, so a failed build cannot leave a missing or non-module artefact behind
        # while reporting success.
        run: node build-substrates.mjs --only=Go

      - name: Versions (recorded so a drift can be attributed to a toolchain change)
        run: |
          node --version
          go version || echo "go: ABSENT"
          wat2wasm --version || echo "wat2wasm: ABSENT"
          lua5.4 -v || echo "lua5.4: ABSENT"

      - name: Run the N-oracle byte-lock
        working-directory: src/wasm-dla/bytelock
        env:
          # RAISED 2 → 9 (2026-08-15), which the previous comment here asked for: "raise it
          # as substrates become reliably buildable in CI; never lower it silently."
          #
          # 2 was an aggregate over NINE independent instruments, so seven could go dark and
          # the count still cleared it — and two of them WERE dark. Go had never been built,
          # and Zig's artefact was an `ar` archive that could not load. The floor noticed
          # neither, because redundancy in the numerator hides a zero.
          #
          # At 9 the floor EQUALS the number of substrates this runner provides a toolchain
          # for, which makes an aggregate floor per-route by exhaustion: any single
          # substrate failing to execute drops the count to 8 and exits 2. That is the whole
          # roster held to account, with no list to keep in sync.
          #
          # Lower this ONLY together with removing a substrate from the roster — an honestly
          # smaller N is worth more than a padded one, but the two numbers must move as one.
          BYTELOCK_MIN_SUBSTRATES: ${{ matrix.min_substrates }}
          # PER-ROUTE FLOOR. The aggregate above catches *count* regressions; this list
          # catches *identity* regressions — a renamed substrate that passes the count but
          # never actually ran. A missing one fails and is named.
          #
          # The list belongs here rather than in the runner because which toolchains exist
          # is a property of THIS environment: the apt step above installs wabt and lua5.4,
          # node is preinstalled, and the six .wasm modules are committed.
          #
          # Go is DECLARED ABSENT, not silently missing: `run-go-wasm.mjs` needs
          # `dla-canonical-go.wasm`, which is not committed and is not built here, so Go has
          # never been exercised in CI. Add it to this list in the same change that builds it.
          BYTELOCK_REQUIRED_SUBSTRATES: ${{ matrix.required_substrates }}
        run: node run-bytelock-ci.mjs

      # THE NEGATIVE CONTROLS HAD NEVER RUN EITHER. `test-fault-injection.mjs` is the suite
      # that proves this byte-lock can DETECT a fault — corrupt trajectory, corrupt cluster
      # size, all-zeros output, liveness floor, absent toolchain, malformed artefact, and a
      # substrate that ran and crashed. Until 2026-08-15 no workflow referenced it, so the
      # evidence that the byte-lock is falsifiable was itself never gathered. A suite that
      # never executes is the same defect as a substrate that never executes, one level up.
      #
      # It mutates files in the working tree (reference.mjs, run-bytelock-ci.mjs, the Zig
      # artefact) and restores them in `finally`, so it runs AFTER the real byte-lock and
      # before the report is emitted.
      #
      # Eight controls since 2026-08-16, not seven: #8 is the reference-drift pin (exit 4). It
      # also forced faults 1-3 to be honest — they used to move the EXPECTATION and call the
      # result a substrate divergence, which the pin now catches as drift. They corrupt what a
      # substrate returns instead, and each asserts the blast radius is exactly one substrate.
      - name: Run the fault-injection negative controls
        working-directory: src/wasm-dla/bytelock
        run: node test-fault-injection.mjs

      - name: Emit the machine-readable report
        if: always()
        working-directory: src/wasm-dla/bytelock
        env:
          # Kept equal to the run step above so the uploaded report describes the same
          # instrument the job was judged on. `|| true` keeps the drift record uploadable
          # even when the run step failed — which is precisely when it is worth reading.
          BYTELOCK_MIN_SUBSTRATES: ${{ matrix.min_substrates }}
        run: node run-bytelock-ci.mjs --json > bytelock-report.json || true

      - name: Upload the report (the drift record)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # PER-LEG NAME. A shared name would have the legs overwrite one another and
          # leave exactly one report behind -- which the cross-processor job below would
          # then correctly REFUSE as "fewer than two legs", but only after the evidence
          # was already gone.
          name: bytelock-report-${{ matrix.os }}
          path: src/wasm-dla/bytelock/bytelock-report.json
          if-no-files-found: warn
          retention-days: 30

  # ==========================================================================
  # THE CROSS-PROCESSOR COMPARISON -- the fault class no checksum can see.
  # ==========================================================================
  #
  # The byte-lock above proves nine implementations agree with a committed
  # trajectory. Until 2026-09-05 it ran on ONE runner, so it could not prove
  # anything about the MACHINE: an error-correcting code detects corruption of
  # the data, and if the processor miscomputes it computes the check wrong too,
  # consistently and in agreement with itself. Mercurial cores do exactly this --
  # miscompute specific inputs while passing every self-test (Hochschild et al.,
  # "Cores That Don't Count", HotOS 2021).
  #
  # This job holds source, input and expectation fixed and varies only the
  # hardware. A disagreement here has one explanation left.
  #
  # It runs `if: always()` ON PURPOSE. The interesting case is a leg that FAILED
  # while its siblings passed, and a `needs:` that only fires on success would
  # skip precisely then.
  cross-processor:
    name: cross-processor byte-lock
    needs: bytelock
    if: always()
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download every leg's report
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: bytelock-report-*
          path: legs

      - name: Prove the comparator can fail before trusting it
        # The negative controls for THIS file, run before its verdict is believed.
        # A comparator that cannot report a divergence would turn the whole matrix
        # into decoration, and it would do so silently.
        working-directory: src/wasm-dla/bytelock
        run: node compare-across-legs.mjs --self-test

      - name: Compare the legs against each other
        # Exit 1 = the machines disagree. Exit 2 = REFUSED, meaning it could not
        # compare (fewer than two readable legs, or no shared substrate). Both are
        # failures; only the first is a divergence, and the message says which.
        run: node src/wasm-dla/bytelock/compare-across-legs.mjs legs
