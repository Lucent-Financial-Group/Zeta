name: Passkey proposal → gated commit



on:

  issues:
  
    types: [opened]
    


permissions:

  contents: write
  
  issues: write
  


concurrency:

  group: passkey-proposal-${{ github.event.issue.number }}
  
  cancel-in-progress: false
  


jobs:

  verify-and-stage:
  
    if: startsWith(github.event.issue.body, '<!-- zeta-proposal-v1 -->')
    
    runs-on: ubuntu-24.04
    
    steps:
    
      - name: Check out protected main with full evidence history
      
        uses: actions/checkout@v6
        
        with:
        
          ref: main
          
          fetch-depth: 0
          


      - name: Install the declarative Bun toolchain
      
        uses: oven-sh/setup-bun@v2
        
        with:
        
          bun-version: 1.3.14
          


      - name: Install declared TypeScript dependencies
      
        run: bun install --frozen-lockfile
        


      - name: Configure the bounded review-branch author
      
        run: git config user.name "zeta-proposal-bot[bot]" && git config user.email "zeta-proposal-bot[bot]@users.noreply.github.com"
        


      - name: Verify the passkey envelope and stage a review branch
      
        id: stage
        
        env:
        
          ZETA_PR_ARCHIVE_TOKEN: ${{ secrets.ZETA_PR_ARCHIVE_TOKEN }}
          
        run: bun src/Core.TypeScript/planning/proposal-gated-commit-runner.ts
        


      - name: Record the branch handoff on the source issue
      
        uses: actions/github-script@v8
        
        with:
        
          script: |
          
            const branch = process.env.BRANCH;
            
            const proposal = process.env.PROPOSAL_ID;
            
            await github.rest.issues.createComment({
            
              owner: context.repo.owner,
              
              repo: context.repo.repo,
              
              issue_number: context.issue.number,
              
              body: `Accepted passkey proposal \`${proposal}\` into review branch \`${branch}\`. Required checks remain the authority for merge.`,
              
            });
            
        env:
        
          BRANCH: ${{ steps.stage.outputs.branch }}
          
          PROPOSAL_ID: ${{ steps.stage.outputs.proposal_id }}
          











































